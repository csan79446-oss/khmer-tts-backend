name: Build and push RunPod worker image

# Builds the root Dockerfile and pushes to GHCR. RunPod workers configured with
# ghcr.io/csan79446-oss/khmer-tts-backend:latest pull the new image on their
# next cold start, so pushes to main auto-update the backend.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/csan79446-oss/khmer-tts-backend:latest
            ghcr.io/csan79446-oss/khmer-tts-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
